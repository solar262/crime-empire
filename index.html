<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crime Empire: Neon Districts</title>
  <link rel="stylesheet" href="neon-game.css" />
</head>
<body>
  <div id="game">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div><span>Cash</span><b id="cash">$0</b></div>
      <div><span>Health</span><b id="health">100</b></div>
      <div><span>Wave</span><b id="wave">1</b></div>
      <div><span>Score</span><b id="score">0</b></div>
    </div>

    <div id="mission">
      <strong>MAIN MISSION</strong>
      <p>Survive the neon district and collect cash.</p>
    </div>

    <div id="startScreen" class="overlay">
      <div class="panel">
        <p class="kicker">CRIME EMPIRE</p>
        <h1>NEON DISTRICTS</h1>
        <p>Move through the city, collect cash, dodge rivals, survive waves, and build your empire.</p>
        <button id="startBtn">PLAY</button>
        <small>Desktop: WASD / Arrow keys. Mobile: touch controls.</small>
      </div>
    </div>

    <div id="gameOver" class="overlay hidden">
      <div class="panel">
        <p class="kicker">RUN ENDED</p>
        <h2 id="finalScore">Score: 0</h2>
        <button id="restartBtn">PLAY AGAIN</button>
      </div>
    </div>

    <div id="controls">
      <button id="upBtn">▲</button>
      <button id="leftBtn">◀</button>
      <button id="fireBtn">FIRE</button>
      <button id="rightBtn">▶</button>
      <button id="downBtn">▼</button>
    </div>
  </div>

  <script src="neon-game.js"></script>
</body>
</html>
